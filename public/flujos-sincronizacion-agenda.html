<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CORE TEKER · Suite Completa de Diagramas y Gráficos (Archify)</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #0ea5e9;
      --accent-bg: rgba(14, 165, 233, 0.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #fff;
      font-weight: 700;
      font-size: 11px;
      padding: 4px 9px;
      border-radius: 6px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: #f8fafc;
    }
    .subtitle {
      font-size: 12px;
      color: var(--muted);
    }
    .actions a {
      color: #38bdf8;
      font-size: 12px;
      text-decoration: none;
      padding: 5px 10px;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.08);
      transition: all 0.15s ease;
    }
    .actions a:hover {
      background: rgba(56, 189, 248, 0.18);
    }
    .tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }
    .tab-btn {
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      padding: 6px 11px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .tab-btn:hover {
      background: #273549;
      color: #fff;
    }
    .tab-btn.active {
      background: var(--accent-bg);
      color: #38bdf8;
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(14, 165, 233, 0.25);
    }
    .tab-type {
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .tab-btn.active .tab-type {
      background: rgba(14, 165, 233, 0.25);
      color: #e0f2fe;
    }
    main {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #0b1120;
    }
  </style>
</head>
<body>
  <header>
    <div class="top-row">
      <div class="brand">
        <span class="badge">Archify v3.2</span>
        <div>
          <div class="title">CORE TEKER — Galería Completa de Flujos, Arquitectura y Gráficos</div>
          <div class="subtitle" id="current-desc">Selecciona cualquiera de los 12 tipos de diagramas y gráficos interactivos generados por el skill Archify</div>
        </div>
      </div>
      <div class="actions">
        <a id="open-direct" href="/archify/explainer.html" target="_blank" rel="noopener">Abrir diagrama actual en pestaña completa ↗</a>
      </div>
    </div>
    <nav class="tabs" id="tabs-nav"></nav>
  </header>
  <main>
    <iframe id="viewer-frame" src="/archify/explainer.html" title="Visor Archify"></iframe>
  </main>

  <script>
    const diagrams = [
      {
        id: 'explainer',
        label: '1. Explainer + Gráficos',
        type: 'explainer',
        src: '/archify/explainer.html',
        desc: 'Página explicativa integral con gráficas de barras (xychart), torta (pie), pasos interactivos y código SQL'
      },
      {
        id: 'workflow-horarios',
        label: '2. Flujo Horarios y Cola',
        type: 'workflow',
        src: '/archify/workflow-horarios.html',
        desc: 'Flujo de grabación de horarios, cola tkr_refrescar_agenda (Job 20s) y sincronización en PKGLN_HORARIOS'
      },
      {
        id: 'workflow-directorio',
        label: '3. Flujo Directorio',
        type: 'workflow',
        src: '/archify/workflow-directorio.html',
        desc: 'Flujo de búsqueda de profesionales, cálculo diario de disponibilidad y cruce con bitmap de 288 bits'
      },
      {
        id: 'architecture',
        label: '4. Arquitectura General',
        type: 'architecture',
        src: '/archify/architecture.html',
        desc: 'Mapa de componentes Next.js (:3000 y :3001), DBMS_SCHEDULER y arquitectura Oracle PL/SQL de 5 capas'
      },
      {
        id: 'sequence',
        label: '5. Diagrama de Secuencia',
        type: 'sequence',
        src: '/archify/sequence.html',
        desc: 'Secuencia temporal de llamadas entre Job Scheduler, DAO, PKGLN_HORARIOS, PKGCN_HORARIOS y Directorio'
      },
      {
        id: 'dataflow',
        label: '6. Flujo de Datos (Dataflow)',
        type: 'dataflow',
        src: '/archify/dataflow.html',
        desc: 'Pipeline desde tablas de horarios, ausencias y citas hacia el vector binario tkr_disponibilidad_bitmap'
      },
      {
        id: 'lifecycle',
        label: '7. Ciclo de Vida (Lifecycle)',
        type: 'lifecycle',
        src: '/archify/lifecycle.html',
        desc: 'Máquina de estados del refresco de agenda en tkr_refrescar_agenda (Encolado -> Sincronizado -> Depurado / Error)'
      },
      {
        id: 'erd',
        label: '8. Modelo Entidad-Relación',
        type: 'erd',
        src: '/archify/erd.html',
        desc: 'Esquema relacional de tablas: tkr_usuarios, tkr_horarios_profesional, tkr_citas, tkr_refrescar_agenda y bitmap'
      },
      {
        id: 'class',
        label: '9. Paquetes PL/SQL (Class)',
        type: 'class',
        src: '/archify/class.html',
        desc: 'Contratos y dependencias entre PKGLN_, PKGCN_, PKGCA_ y _DAO según el estándar arquitectónico'
      },
      {
        id: 'tree',
        label: '10. Árbol del Sistema (Tree)',
        type: 'tree',
        src: '/archify/tree.html',
        desc: 'Descomposición jerárquica de capacidades y módulos de CORE TEKER'
      },
      {
        id: 'timeline',
        label: '11. Línea de Tiempo (Timeline)',
        type: 'timeline',
        src: '/archify/timeline.html',
        desc: 'Cronología operativa del caso Cita 737 (Carolina Avila, 2026-10-30 10:00) y su sincronización por Job'
      },
      {
        id: 'waterfall',
        label: '12. Cascada de Tiempos (Waterfall)',
        type: 'waterfall',
        src: '/archify/waterfall.html',
        desc: 'Desglose de tiempos de ejecución por etapa dentro de PKGLN_HORARIOS.p_actualizar_agenda'
      }
    ];

    const nav = document.getElementById('tabs-nav');
    const frame = document.getElementById('viewer-frame');
    const desc = document.getElementById('current-desc');
    const openDirect = document.getElementById('open-direct');

    function selectTab(item, btnEl) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btnEl.classList.add('active');
      frame.src = item.src;
      desc.textContent = item.desc;
      openDirect.href = item.src;
    }

    diagrams.forEach((item, idx) => {
      const btn = document.createElement('button');
      btn.className = 'tab-btn' + (idx === 0 ? ' active' : '');
      btn.innerHTML = `<span>${item.label}</span><span class="tab-type">${item.type}</span>`;
      btn.onclick = () => selectTab(item, btn);
      nav.appendChild(btn);
    });
  </script>
</body>
</html>
